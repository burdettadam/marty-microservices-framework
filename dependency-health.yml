version: 1
dependencies:
  - package: aiohttp
    ecosystem: pip
    owner: ElevenID
    upstream: https://github.com/aio-libs/aiohttp
    current: "3.14.3"
    target: current-patched-release
    status: maintained
    decision: upgrade
    advisories:
      - GHSA-cq5v-8q36-5273
      - GHSA-mfx4-hv73-q22v
      - GHSA-mq44-7p77-q5h7
    tracking-issue: https://github.com/ElevenID/marty-microservices-framework/pull/41
    review-after: 2026-09-09
    rationale: All MMF service templates and the production payment example pin aiohttp 3.14.3 or newer. Dependabot now monitors every independently resolved example manifest so GitHub cannot retain a stale root-only dependency snapshot.
  - package: typescript
    ecosystem: npm
    owner: ElevenID
    upstream: https://github.com/microsoft/TypeScript
    current: "6.0.3"
    target: "7.x"
    status: watch
    decision: retain
    advisories: []
    tracking-issue: https://github.com/ElevenID/marty-microservices-framework/issues/66
    review-after: 2026-09-09
    rationale: typescript-eslint 8.66 does not yet support TypeScript 7. The identity UI uses the newest compatible TypeScript release and will adopt 7 when the lint toolchain's supported peer range allows it.
