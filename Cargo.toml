[workspace]
members = [
    "crates/mmf",
    "crates/mmf-config",
    "crates/mmf-core",
    "crates/mmf-messaging",
    "crates/mmf-observability",
    "crates/mmf-resilience",
    "crates/mmf-runtime",
    "crates/mmf-security",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/ElevenID/marty-microservices-framework"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
async-trait = "0.1"
http-body-util = "0.1"
mmf-config = { path = "crates/mmf-config" }
mmf-core = { path = "crates/mmf-core" }
mmf-messaging = { path = "crates/mmf-messaging" }
mmf-observability = { path = "crates/mmf-observability" }
mmf-resilience = { path = "crates/mmf-resilience" }
mmf-runtime = { path = "crates/mmf-runtime" }
mmf-security = { path = "crates/mmf-security" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
