name: Release marty-msf

on:
  push:
    tags: ["v*"]

concurrency:
  group: marty-msf-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git cat-file -t "refs/tags/$TAG")" = tag

          tag_object="$(git rev-parse "refs/tags/$TAG")"
          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          remote_object="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$remote_object" = "$tag_object"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main

          message="$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")"
          test "$(printf '%s\n' "$message" | grep -c '^Stable-Tag-Gate: elevenid.stable-tag-preparation/v1$')" = 1
          test "$(printf '%s\n' "$message" | grep -c '^Preparation-Run: [0-9][0-9]*$')" = 1
          test "$(printf '%s\n' "$message" | grep -c '^Source-SHA: [0-9a-f]\{40\}$')" = 1
          preparation_run="$(printf '%s\n' "$message" | sed -n 's/^Preparation-Run: //p')"
          source_marker="$(printf '%s\n' "$message" | sed -n 's/^Source-SHA: //p')"
          test "$source_marker" = "$commit"

          for attempt in $(seq 1 12); do
            gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/runs/$preparation_run" > preparation-run.json
            if jq -e '.status == "completed"' preparation-run.json >/dev/null; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "::error::Stable-tag preparation did not reach a terminal state"
              exit 1
            fi
            sleep 5
          done
          jq -e --arg commit "$commit" '
            .path == ".github/workflows/prepare-stable-tag.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .head_sha == $commit
            and .status == "completed"
            and .conclusion == "success"
          ' preparation-run.json >/dev/null

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it will not be changed"
            exit 1
          fi

          expected="${TAG#v}"
          actual="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$actual" = "$expected"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build Python distributions
        run: python -m pip install build==1.5.0 && python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marty-msf-python
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marty-msf-python
          path: release
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: release/marty-msf-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 |
            while IFS= read -r -d '' file; do
              cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
            done
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd release && sha256sum --check --strict SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/**
      - name: Publish the immutable release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          remote_object="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$remote_object" = "$tag_object"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; it will not be changed"
            exit 1
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "marty-msf $TAG"

          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > published-release.json
          jq -e '.draft == false and .immutable == true' published-release.json >/dev/null
          for file in release/*; do
            name="$(basename "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            jq -e --arg name "$name" --arg digest "$digest" \
              '[.assets[] | select(.name == $name and .digest == $digest)] | length == 1' \
              published-release.json >/dev/null
          done

  publish:
    if: vars.ENABLE_PUBLIC_REGISTRY_PUBLISHING == 'true'
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: marty-msf-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
