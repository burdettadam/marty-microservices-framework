version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "12:00"
      timezone: America/Denver
    groups:
      rust-dependencies:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "13:00"
      timezone: America/Denver
    groups:
      github-actions-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 2
